    <style>
:root{font-family:Inter,system-ui,'Noto Sans Tamil',sans-serif;color:#15213d;background:#f5f7fc}
*{box-sizing:border-box}
body{margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #13b8a6;outline-offset:3px}
.shell{max-width:1200px;margin:auto;padding:24px}
.top{background:white;border-bottom:1px solid #e5e9f2;position:sticky;top:0;z-index:10}
.nav{max-width:1200px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 24px}
.brand{font-weight:850;font-size:22px;color:#16275a}.brand b{color:#0aab9a}
.links{display:flex;flex-wrap:wrap;gap:5px}
.links button,.ghost{border:0;background:transparent;color:#42516e;padding:9px;border-radius:9px}
.links button:hover,.ghost:hover{background:#f0f3ff}
.primary{background:#4f46e5;color:white;border:0;padding:12px 20px;border-radius:11px;font-weight:700}
.primary:hover{background:#3730a3}
.secondary{background:#e8f7f5;color:#087d74;border:0;padding:11px 16px;border-radius:10px;font-weight:700}
.card{background:#fff;border:1px solid #e8ecf5;border-radius:18px;padding:24px;box-shadow:0 7px 30px #192b5910}
.hero{background:linear-gradient(115deg,#142754,#2c3487 70%,#116d7a);color:white;border-radius:25px;padding:58px 42px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px}
.hero h1{font-size:clamp(30px,4vw,54px);line-height:1.12;margin:12px 0}
.hero p{color:#e4ebff;line-height:1.7}
.hero .primary{background:#13b8a6;color:#082a39}
.tag{display:inline-block;padding:7px 11px;background:#e8f8f5;color:#077e76;border-radius:30px;font-size:12px;font-weight:750}
.hero .tag{background:#ffffff25;color:#fff}
.mini{background:#ffffff18;border:1px solid #ffffff35;border-radius:16px;padding:22px;align-self:center}
.mini .meter{background:#ffffff33}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.stat{font-size:32px;font-weight:850;color:#302c88}
.muted{color:#64718a}
.tiny{font-size:12px}
.section{margin:30px 0}
.section h2{font-size:25px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:7px;margin:12px 0;font-weight:650;font-size:14px}
.field input,.field select{width:100%;padding:12px;border:1px solid #d8dfec;border-radius:10px;background:white;color:#172444}
.meter{height:10px;background:#e7ebf4;border-radius:12px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#13b8a6,#4f46e5);border-radius:12px}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid #dfe5f0;border-radius:12px;padding:13px;margin:9px 0;color:#203254}
.choice.selected{border:2px solid #4f46e5;background:#f1f0ff}
.step{border-left:3px solid #dfe4f3;margin-left:11px;padding:2px 0 18px 23px;position:relative}
.step:before{content:'';position:absolute;left:-9px;top:5px;background:#4f46e5;border:3px solid white;border-radius:50%;width:13px;height:13px}
.step.done:before{background:#0aa68c}
.notice{padding:13px;background:#edf7ff;border-radius:10px;color:#274a75;margin:15px 0}.error{background:#fff0ef;color:#8b2d27}
.quiz-feedback{padding:12px;background:#f0faf6;border-radius:10px}
.chartline{display:grid;grid-template-columns:115px 1fr 42px;align-items:center;gap:12px;margin:16px 0}
.pill{background:#f0f3fa;padding:5px 9px;border-radius:30px;font-size:12px;color:#52617e}.footer{margin-top:40px;border-top:1px solid #e2e6f0;padding:25px;color:#66738c}
.hide{display:none!important}h1,h2,h3{letter-spacing:-.025em}p{line-height:1.65}ul{line-height:1.9}body.low *{animation:none!important;transition:none!important;scroll-behavior:auto!important}body.low .hero{background:#142754}@media(max-width:750px){.hero{grid-template-columns:1fr;padding:28px 23px}.grid,.grid2{grid-template-columns:1fr}.nav{align-items:flex-start;flex-wrap:wrap}.links{order:3;width:100%;overflow:auto;flex-wrap:nowrap}.links button{white-space:nowrap}.shell{padding:16px}.card{padding:18px}.chartline{grid-template-columns:85px 1fr 35px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>

mentById('band').setAttribute('aria-pressed',String(!!state.low));document.body.classList.toggle('low',!!state.low);document.documentElement.lang=state.lang}function go(p){page=p;selectedAnswer=null;checked=false;render();window.scrollTo(0,0)}

else if(page==='onboarding'){let p=state.profile||{};s=`<h1>${tr('profile')}</h1>${card(`<form id="onboard"><div class="grid2"><label class="field">${tr('name')}<input name="name" required maxlength="60" value="${esc(p.name||'')}" placeholder="Student name"></label><label class="field">${tr('district')}<select name="district" required>${['','Vellore','Chennai','Coimbatore','Madurai','Tiruvannamalai','Salem','Tiruchirappalli','Villupuram','Other'].map(x=>`<option ${p.district===x?'selected':''} value="${x}">${x||'Select district'}</option>`).join('')}</select></label><label class="field">${tr('education')}<select name="education">${['College student','School student','Graduate','Other'].map(x=>`<option ${p.education===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">${tr('language')}<select name="language"><option value="ta" ${p.language==='ta'?'selected':''}>தமிழ்</option><option value="en" ${p.language==='en'?'selected':''}>English</option></select></label><label class="field">${tr('goal')}<select name="track">${Object.entries(NAMES).map(([k,v])=>`<option value="${k}" ${p.track===k?'selected':''}>${esc(state.lang==='ta'?TA[k]:v)}</option>`).join('')}</select></label><label class="field">${tr('hours')}<input type="number" min="1" max="40" name="hours" required value="${esc(p.hours||3)}"></label><label class="field">${tr('internet')}<select name="internet">${['Limited','Regular','Reliable'].map(x=>`<option ${p.internet===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Self-rated skill level<select name="level">${['Beginner','Some experience','Confident'].map(x=>`<option ${p.level===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label class="row"><input type="checkbox" required name="consent"> ${tr('consent')}</label><p class="tiny muted">Do not enter sensitive personal information. Demo data stays in this browser.</p><button class="primary" type="submit">${tr('continue')}</button></form>`)}`}
else if(page==='assessment'){if(!profile())return go('onboarding');let qs=QUESTIONS.filter(q=>q.track===state.profile.track);s=`<h1>${tr('assessment')}</h1><p class="muted">${esc(NAMES[state.profile.track])} · ${qs.length} questions · Select one answer per question</p>${card(`<form id="assessmentForm">${qs.map((q,i)=>`<fieldset style="border:0;border-bottom:1px solid #edf0f5;padding:15px 0"><legend><b>${i+1}. ${esc(q.prompt)}</b></legend>${q.options.map((o,j)=>`<label class="choice"><input type="radio" required name="${q.id}" value="${j}" ${state.answers[q.id]===j?'checked':''}> ${esc(o)}</label>`).join('')}</fieldset>`).join('')}<button class="primary" type="submit">${tr('submit')}</button></form>`)}`}
else if(page==='results'){if(!state.assessed)return go('assessment');let sc=score();s=`<h1>${tr('results')}</h1><div class="grid2">${card(`<div class="muted">Overall assessment</div><div class="stat">${sc.overall}%</div>${pct(sc.overall)}<p class="muted">Based on ${QUESTIONS.filter(q=>q.track===state.profile.track).length} answered questions</p>`)}${card(`<h3>Explainable recommendation</h3><p>Beginner target: 80% per competency. Modules are ordered by gap while preserving prerequisites. Weekly time: ${esc(state.profile.hours)} hours.</p>${btn(tr('generate'),'roadmap')}`)}</div>${card(`<h2>Skill breakdown</h2>${Object.entries(sc.scores).map(([k,v])=>`<div class="chartline"><b>${esc(k)}</b>${pct(v)}<span>${v}%</span></div><p class="tiny muted">${k}: ${Math.max(0,80-v)} point gap to the demo target</p>`).join('')}`)}`}
else if(page==='roadmap'){if(!state.assessed)return go('assessment');s=`<h1>${tr('roadmap')}</h1><p class="muted">${esc(NAMES[state.profile.track])} · ${esc(state.profile.hours)} hours/week · prerequisite-aware sequencing</p>${card(roadmap().map((m,i)=>`<div class="step ${state.completed.includes(m.id)?'done':''}"><div class="row between"><h3>${i+1}. ${esc(m.title)}</h3><span class="pill">${state.completed.includes(m.id)?'✓ Completed':`${m.minutes} min · ~${m.weeks} week(s)`}</span></div><p>${esc(m.description)}</p><p class="muted tiny"><b>${tr('why')}:</b> ${m.gap?`Assessed ${m.skill} score ${score().scores[m.skill]}%; ${m.gap}-point gap to the 80% demo target.`:`${m.skill} meets the 80% demo target; practice is still available.`} ${m.prerequisites.length?'Prerequisite: '+m.prerequisites.join(', ')+'.':''}</p>${btn(tr('view'),'lesson:'+m.id,'secondary')}</div>`).join(''))}`}
else if(page==='lesson'){let m=MODULES.find(x=>x.id===currentLesson&&x.track===state.profile?.track);if(!m)return go('roadmap');let locked=m.prerequisites.some(id=>!state.completed.includes(id));s=`<div class="row">${btn(tr('back'),'roadmap','ghost')}<span class="pill">${esc(m.skill)} · ${m.minutes} minutes</span></div><h1>${esc(m.title)}</h1>${locked?card(`<h3>Prerequisite required</h3><p>Complete ${m.prerequisites.map(esc).join(', ')} before this module.</p>`):card(`<p class="muted">${esc(m.description)}</p>${m.content.map((x,i)=>`<div class="notice"><b>Concept ${i+1}</b><p>${esc(x)}</p></div>`).join('')}<h3>Knowledge check</h3><p>${esc(m.quiz.question)}</p>${m.quiz.options.map((o,i)=>`<button class="choice ${selectedAnswer===i?'selected':''}" data-answer="${i}">${esc(o)}</button>`).join('')}${checked?`<div class="quiz-feedback" role="status"><b>${selectedAnswer===m.quiz.answer?'Correct!':'Not quite.'}</b><p>${esc(m.quiz.explanation)}</p></div>`:''}<div class="row">${btn(tr('finish'),'check')}${checked&&selectedAnswer===m.quiz.answer?btn(tr('complete'),'complete','secondary'):''}</div>`)}`}
else if(page==='dashboard'){if(!profile())return go('onboarding');let relevant=MODULES.filter(m=>m.track===state.profile.track),done=relevant.filter(m=>state.completed.includes(m.id)).length;s=`<h1>${tr('welcome')}, ${esc(state.profile.name)} 👋</h1><p class="muted">${esc(state.profile.district)} · ${esc(NAMES[state.profile.track])}</p><div class="grid">${card(`<p class="muted">Modules completed</p><div class="stat">${done}/${relevant.length}</div>${pct(100*done/relevant.length)}`)}${card(`<p class="muted">Diagnostic accuracy</p><div class="stat">${state.assessed?score().overall+'%':'—'}</div><p class="tiny muted">${state.assessed?'Based on saved assessment':'Assessment not yet taken'}</p>`)}${card(`<p class="muted">Milestones</p><div class="stat">${done}</div><p class="tiny muted">Passed lesson checks</p>`)}</div><section class="section">${card(`<h2>Suggested next step</h2><p>${!state.assessed?'Take the baseline assessment to unlock a personalized roadmap.':done===relevant.length?'You completed all available modules. Review your Skill Passport.':'Continue your next incomplete lesson.'}</p>${btn(!state.assessed?tr('assessment'):tr('roadmap'),!state.assessed?'assessment':'roadmap')}`)}</section>`}
else if(page==='passport'){if(!profile())return go('onboarding');let done=MODULES.filter(m=>m.track===state.profile.track&&state.completed.includes(m.id));s=`<h1>${tr('passport')}</h1>${card(`<span class="tag">Non-accredited learning summary · Demo</span><h2>${esc(state.profile.name)}</h2><p>${esc(NAMES[state.profile.track])} · ${esc(state.profile.district)}</p><p>Diagnostic score: <b>${state.assessed?score().overall+'%':'Not completed'}</b></p><p>Passed in-app module checks: <b>${done.length}</b></p><ul>${done.map(m=>`<li>${esc(m.title)}</li>`).join('')||'<li>No completed modules yet</li>'}</ul><p class="muted tiny">This records activity in this browser only. It is not an external verification or accredited certificate.</p><button class="primary" onclick="window.print()">Print / Save PDF</button>`)}`}
else if(page==='career'){s=`<h1>${tr('career')}</h1><div class="grid2">${card(`<h3>Portfolio checklist</h3><ul><li>Describe a real project and your contribution</li><li>Show screenshots or a working demo</li><li>Explain a challenge and solution</li><li>Include contact information only if you choose</li></ul>`)}${card(`<h3>Interview practice</h3><p>Tell me about a time you solved a problem. Describe the situation, your action, and the result.</p><p>Practice one 30-second introduction.</p>`)}${card(`<h3>Project suggestions</h3><p>Frontend: personal portfolio. Digital literacy: file organization guide. Communication: recorded introduction and interview notes.</p>`)}${card(`<h3>Next skills</h3><p>Build on completed fundamentals, then explore supervised practice, teamwork and real project feedback.</p>`)}</div>`}
else if(page==='resources'){s=`<h1>${tr('resources')}</h1><p class="muted">Free public resources. These links should be verified online before hackathon submission; offline learning modules above work without internet.</p><div class="grid">${[['MDN Web Docs','https://developer.mozilla.org/','HTML, CSS and JavaScript'],['GCFGlobal','https://edu.gcfglobal.org/','Digital literacy'],['British Council LearnEnglish','https://learnenglish.britishcouncil.org/','English communication']].map(x=>card(`<h3>${x[0]}</h3><p>${x[2]}</p><a href="${x[1]}" target="_blank" rel="noopener noreferrer">Visit resource ↗</a>`)).join('')}</div>`}
document.getElementById('app').innerHTML=s;}
function demo(){state.profile={name:'Demo Student · Kavya',district:'Vellore',education:'College student',language:'ta',track:'frontend',hours:3,internet:'Limited',level:'Beginner'};state.answers={};state.assessed=false;state.completed=[];state.synthetic=true;state.lang='ta';save();go('assessment')}
document.addEventListener('click',e=>{let lang=e.target.closest('#lang'),band=e.target.closest('#band'),g=e.target.closest('[data-go]'),act=e.target.closest('[data-act]'),answer=e.target.closest('[data-answer]');if(lang){state.lang=state.lang==='en'?'ta':'en';save();render()}else if(band){state.low=!state.low;save();render()}else if(g)go(g.dataset.go);else if(answer){selectedAnswer=Number(answer.dataset.answer);checked=false;render()}else if(act){let a=act.dataset.act;if(a==='start')go('onboarding');else if(a==='demo')demo();else if(a==='roadmap'||a==='assessment')go(a);else if(a.startsWith('lesson:')){currentLesson=a.slice(7);go('lesson')}else if(a==='check'){if(selectedAnswer===null){alert('Choose an answer first.');return}checked=true;render()}else if(a==='complete'){let m=MODULES.find(x=>x.id===currentLesson);if(m&&checked&&selectedAnswer===m.quiz.answer&&!state.completed.includes(m.id)){state.completed.push(m.id);save()}go('dashboard')}}});
document.addEventListener('submit',e=>{if(e.target.id==='onboard'){e.preventDefault();let f=new FormData(e.target),hours=Number(f.get('hours'));if(hours<1||hours>40)return alert('Choose 1–40 hours per week.');let track=f.get('track');let changed=state.profile?.track!==track;state.profile={name:String(f.get('name')).trim(),district:f.get('district'),education:f.get('education'),language:f.get('language'),track,hours,internet:f.get('internet'),level:f.get('level')};if(changed){state.answers={};state.assessed=false;state.completed=[]}state.lang=state.profile.language;state.synthetic=false;save();go(state.assessed?'dashboard':'assessment')}else if(e.target.id==='assessmentForm'){e.preventDefault();let f=new FormData(e.target);state.answers={};for(let q of QUESTIONS.filter(q=>q.track===state.profile.track)){if(!f.has(q.id))return alert('Answer every question.');state.answers[q.id]=Number(f.get(q.id))}state.assessed=true;state.completed=[];save();go('results')}});
render();
</script></body></html>
